name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGINVAL_VERSION: v1.0.3

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26,       arch: arm64 }
          - { os: macos-26-intel, arch: x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch JUCE
        run: git clone --depth 1 --branch 9.0.5 https://github.com/juce-framework/JUCE.git third_party/JUCE
      - name: Configure
        run: >-
          cmake -S . -B build -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          -DSNAPLINE_BUILD_TOOLS=ON
      - name: Build plugins
        run: cmake --build build --config Release --target Snapline_VST3 Snapline_AU SnaplineRender -j 4
      - name: DSP checks
        run: build/SnaplineRender_artefacts/Release/SnaplineRender
      - name: Plugin checks
        run: |
          cmake --build build --config Release --target SnaplineSnapshot -j 4
          build/SnaplineSnapshot_artefacts/Release/SnaplineSnapshot --check
      - name: Ad-hoc sign bundles
        run: |
          for b in VST3/Snapline.vst3 AU/Snapline.component; do
            codesign --force --deep --sign - "build/Snapline_artefacts/Release/$b"
          done
      - name: Installer smoke test
        run: |
          mkdir -p dist/plugins
          cp -R build/Snapline_artefacts/Release/VST3/Snapline.vst3 build/Snapline_artefacts/Release/AU/Snapline.component dist/plugins/
          build/macos/make-pkg.sh dist/plugins 0.0.0-ci dist/Snapline-ci.pkg
          pkgutil --expand-full dist/Snapline-ci.pkg dist/expanded
          test -d dist/expanded/au.pkg/Payload/Library/Audio/Plug-Ins/Components/Snapline.component
          test -d dist/expanded/vst3.pkg/Payload/Library/Audio/Plug-Ins/VST3/Snapline.vst3
          rm -rf dist
      - name: Verify plugin bundles
        run: |
          test -d build/Snapline_artefacts/Release/VST3/Snapline.vst3
          test -d build/Snapline_artefacts/Release/AU/Snapline.component
          codesign --verify --deep --strict build/Snapline_artefacts/Release/VST3/Snapline.vst3
          codesign --verify --deep --strict build/Snapline_artefacts/Release/AU/Snapline.component
      - name: Validate Audio Unit
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Snapline_artefacts/Release/AU/Snapline.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -strict -v aumf SNL1 SNPL
      - name: pluginval (strictness 10, AU and VST3)
        run: |
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 --connect-timeout 30 -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          ditto -x -k pluginval.zip pluginval-bin
          for bundle in AU/Snapline.component VST3/Snapline.vst3; do
            pluginval-bin/pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process \
              "build/Snapline_artefacts/Release/$bundle"
          done
      - name: Upload plugins
        uses: actions/upload-artifact@v7
        with:
          name: Snapline-macos-${{ matrix.arch }}
          path: |
            build/Snapline_artefacts/Release/VST3/Snapline.vst3
            build/Snapline_artefacts/Release/AU/Snapline.component
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (x64, VST3)
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
      - name: Fetch JUCE
        run: git clone --depth 1 --branch 9.0.5 https://github.com/juce-framework/JUCE.git third_party/JUCE
      - name: Configure
        run: cmake -S . -B build -A x64 -DSNAPLINE_BUILD_TOOLS=ON
      - name: Build plugin
        run: cmake --build build --config Release --target Snapline_VST3 SnaplineRender -- /m
      - name: DSP checks
        run: build/SnaplineRender_artefacts/Release/SnaplineRender.exe
      - name: pluginval (strictness 10, VST3)
        shell: pwsh
        run: |
          # GitHub's download endpoint sometimes answers with a 5xx page; retry with a growing pause.
          $url = "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_VERSION/pluginval_Windows.zip"
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile pluginval.zip -TimeoutSec 120
              if ((Get-Item pluginval.zip).Length -gt 100000) { break }
              throw "downloaded file is too small"
            } catch {
              if ($attempt -eq 6) { throw "pluginval download failed after $attempt attempts" }
              Write-Host "Download attempt $attempt failed, retrying in $($attempt * 10) s"
              Start-Sleep -Seconds ($attempt * 10)
            }
          }
          Expand-Archive pluginval.zip -DestinationPath pluginval-bin
          # pluginval.exe is a GUI-subsystem program: `&` returns at once without an exit code (the
          # check then threw while pluginval was still running), so wait for it explicitly.
          $p = Start-Process -FilePath .\pluginval-bin\pluginval.exe -NoNewWindow -Wait -PassThru `
            -ArgumentList '--strictness-level', '10', '--validate-in-process', "`"$PWD\build\Snapline_artefacts\Release\VST3\Snapline.vst3`""
          if ($p.ExitCode -ne 0) { throw "pluginval failed with exit code $($p.ExitCode)" }
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.0.0-ci `
            "/DSourceDir=$PWD\build\Snapline_artefacts\Release\VST3" "/DOutputDir=$PWD\dist" build\windows\snapline.iss
      - name: Verify plugin bundle and installer
        shell: pwsh
        run: |
          if (-not (Test-Path build/Snapline_artefacts/Release/VST3/Snapline.vst3/Contents/x86_64-win/Snapline.vst3)) { throw "VST3 binary missing" }
          if (-not (Test-Path dist/Snapline-0.0.0-ci-windows-x64-setup.exe)) { throw "Installer missing" }
      - name: Upload plugin and installer
        uses: actions/upload-artifact@v7
        with:
          name: Snapline-windows-x64
          path: |
            build/Snapline_artefacts/Release/VST3/Snapline.vst3
            dist/*.exe
          if-no-files-found: error
          retention-days: 14

  result:
    name: Build result
    if: always()
    needs: [macos, windows]
    runs-on: ubuntu-26.04
    steps:
      - name: All builds succeeded
        env:
          MACOS: ${{ needs.macos.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: test "$MACOS" = success && test "$WINDOWS" = success
