name: Feature request
description: Suggest an idea or improvement for Snapline
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the vocal workflow or problem, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: A control, example or rough sketch is helpful.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
